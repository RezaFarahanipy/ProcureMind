<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProcureMind — تست چت و OCR</title>
<style>
/* فونت فقط در همین بخش تعریف می‌شود (:root --font-ui / --font-tech) */
@font-face{font-family:"SG Kara FaNum";font-weight:300;src:url(fonts/SGKara-FaNum-Light.woff2) format("woff2")}
@font-face{font-family:"SG Kara FaNum";font-weight:400;src:url(fonts/SGKara-FaNum-Regular.woff2) format("woff2")}
@font-face{font-family:"SG Kara FaNum";font-weight:600;src:url(fonts/SGKara-FaNum-SemiBold.woff2) format("woff2")}
@font-face{font-family:"SG Kara FaNum";font-weight:700;src:url(fonts/SGKara-FaNum-Bold.woff2) format("woff2")}
@font-face{font-family:"SG Kara";font-weight:300;src:url(fonts/SGKara-Std-Light.woff2) format("woff2")}
@font-face{font-family:"SG Kara";font-weight:400;src:url(fonts/SGKara-Std-Regular.woff2) format("woff2")}
@font-face{font-family:"SG Kara";font-weight:600;src:url(fonts/SGKara-Std-SemiBold.woff2) format("woff2")}
@font-face{font-family:"SG Kara";font-weight:700;src:url(fonts/SGKara-Std-Bold.woff2) format("woff2")}
:root{
  --font-ui:"SG Kara FaNum",Tahoma,system-ui,sans-serif;   /* ارقام فارسی */
  --font-tech:"SG Kara",Tahoma,system-ui,sans-serif;        /* ارقام لاتین: شناسه، شماره حساب، مدل */
  --bg:#f4f5f7;--panel:#fff;--text:#1b1f24;--muted:#6b7280;--line:#e2e5ea;
  --accent:#1f6feb;--user:#e8f0fe;--bot:#f1f3f5;--ok:#1a9a4a;--bad:#d1242f;
}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--panel:#1d2127;--text:#e7e9ec;--muted:#9aa3ad;--line:#2d333b;--accent:#4c8dff;--user:#1f3350;--bot:#262c33}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:15px}
.tech,code,.ltr{font-family:var(--font-tech);direction:ltr;unicode-bidi:embed}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.dot.ok{background:var(--ok)}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;min-height:0}
@media (max-width:900px){main{grid-template-columns:1fr;overflow:auto}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
section>h2{font-size:14px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center}
#log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;line-height:1.9;word-break:break-word}
.msg.user{background:var(--user);align-self:flex-start}
.msg.assistant{background:var(--bot);align-self:flex-end}
.msg.err{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.stat{font-size:11px;color:var(--muted);margin-top:6px}
.reason{font-size:12px;color:var(--muted);border-inline-start:3px solid var(--line);padding-inline-start:8px;margin-bottom:6px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
textarea,input[type=file],select{font-family:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.composer textarea{flex:1;resize:none;height:56px}
button{font-family:inherit;font-size:14px;cursor:pointer;border:0;border-radius:8px;padding:8px 16px;background:var(--accent);color:#fff}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
.ocrbox{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ocrText{flex:1;min-height:180px;resize:none;line-height:1.9;width:100%}
#ocrStatus{font-size:12px;color:var(--muted);min-height:18px}
.models{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.mcard{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mcard b{min-width:68px}
.mcard select{max-width:340px}
.mstat{font-size:12px;color:var(--muted)}
.mstat.ready{color:var(--ok)} .mstat.failed{color:var(--bad)}
#mErr{margin:0;font-size:11px;color:var(--bad);white-space:pre-wrap;max-height:90px;overflow:auto;direction:ltr;text-align:left}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>ProcureMind <span class="pill">نمونه اولیه فاز ۱: تست چت و OCR</span></h1>
  <span class="pill"><span class="dot" id="dQwen"></span>Qwen <span class="tech">:8080</span></span>
  <span class="pill"><span class="dot" id="dOcr"></span>OCR <span class="tech">:8081</span></span>
  <span class="pill" id="res"></span>
</header>
<div class="models">
  <div class="mcard">
    <b>مدل چت</b>
    <select id="chatModel"></select>
    <select id="chatCtx" title="طول context (کمتر = RAM کمتر)"><option value="2048">ctx 2048</option><option value="4096" selected>ctx 4096</option><option value="8192">ctx 8192</option></select>
    <button id="chatLoad">بارگذاری</button><button class="sec" id="chatUnload">خاموش</button>
    <span class="mstat" id="chatStat">—</span>
  </div>
  <div class="mcard">
    <b>مدل OCR</b>
    <select id="ocrModel"></select>
    <select id="ocrMmproj" title="فایل mmproj (بخش بینایی)"></select>
    <select id="ocrCtx" title="طول context"><option value="4096">ctx 4096</option><option value="8192" selected>ctx 8192</option><option value="16384">ctx 16384</option></select>
    <button id="ocrLoad">بارگذاری</button><button class="sec" id="ocrUnload">خاموش</button>
    <span class="mstat" id="ocrStat">—</span>
  </div>
  <label class="mstat"><input type="checkbox" id="keepBoth"> هر دو مدل هم‌زمان در RAM بمانند (حافظه زیاد لازم است؛ پیش‌فرض: با بارگذاری یکی، دیگری خاموش می‌شود)</label>
  <pre id="mErr"></pre>
</div>
<main>
  <section>
    <h2>گفت‌وگو با Qwen <button class="sec" id="clear">پاک کردن</button></h2>
    <div id="log"></div>
    <div class="composer">
      <textarea id="input" placeholder="پیام خود را بنویسید… (Enter = ارسال، Shift+Enter = خط جدید)"></textarea>
      <button id="send">ارسال</button>
    </div>
  </section>
  <section>
    <h2>OCR با Dots</h2>
    <div class="ocrbox">
      <div class="row">
        <input type="file" id="file" accept="image/*,.pdf">
        <select id="ocrEngine" title="موتور OCR">
          <option value="dots">موتور: Dots (مدل بینایی-زبانی)</option>
          <option value="paddle">موتور: PaddleOCR (سریع، کلاسیک)</option>
        </select>
        <select id="paddleLang" title="زبان PaddleOCR" style="display:none">
          <option value="fa">فارسی (fa)</option><option value="ar">عربی (ar)</option><option value="en">انگلیسی (en)</option>
        </select>
        <select id="ocrPrompt">
          <option value="Extract the text content from this image.">فقط متن (پیش‌فرض)</option>
          <option value="Extract all text from this image and preserve structure in markdown.">متن با ساختار (مارک‌داون)</option>
        </select>
        <select id="ocrTokens" title="حداکثر طول خروجی">
          <option value="256">حداکثر ۲۵۶ توکن</option>
          <option value="512" selected>حداکثر ۵۱۲ توکن</option>
          <option value="1024">حداکثر ۱۰۲۴ توکن</option>
          <option value="2048">حداکثر ۲۰۴۸ توکن</option>
        </select>
        <button id="ocrBtn">شروع OCR</button>
        <button id="ocrStop" class="sec" style="display:none">توقف</button>
      </div>
      <div class="row">
        <input id="pages" value="1" size="9" title="مثلاً 1 یا 1-3,5 یا all (حداکثر ۱۰ صفحه در هر بار)" placeholder="صفحه‌ها">
        <select id="pdfMode" title="اگر PDF متن واقعی دارد، خواندن مستقیم فوری است؛ اما برای فارسی گاهی ترتیب حروف به‌هم می‌ریزد">
          <option value="auto">PDF: اگر لایه متنی دارد بدون OCR بخوان</option>
          <option value="ocr">PDF: همیشه OCR</option>
        </select>
        <select id="pdfStyle" title="روش خواندن لایه متنی PDF">
          <option value="layout">لایه متنی: مرتب‌شده (راست‌به‌چپ + ستون‌های جدول)</option>
          <option value="raw">لایه متنی: خام</option>
        </select>
        <span id="pdfInfo" class="pill"></span>
      </div>
      <div id="ocrStatus"></div>
      <div class="row tabs">
        <button class="sec active" id="tabDots">نتیجه Dots</button>
        <button class="sec" id="tabPaddle">نتیجه PaddleOCR</button>
        <button class="sec" id="paddleUnload" style="display:none" title="آزاد کردن RAM مدل PaddleOCR">آزاد کردن Paddle</button>
        <span id="cmpInfo" class="pill"></span>
      </div>
      <textarea id="ocrText" placeholder="متن استخراج‌شده اینجا نمایش داده می‌شود و قابل ویرایش است."></textarea>
      <div class="row">
        <select id="task">
          <option value="summary">خلاصه ساختاریافته</option>
          <option value="proforma">استخراج اطلاعات پیش‌فاکتور (JSON)</option>
          <option value="request">استخراج اطلاعات درخواست خرید (JSON)</option>
          <option value="free">فقط متن را بفرست (سؤال را خودم در چت می‌نویسم)</option>
        </select>
        <button id="toQwen">ارسال متن اصلاح‌شده به Qwen</button>
      </div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const history = [{role:"system", content:"تو دستیار هوشمند بخش تدارکات و بازرگانی هستی. به فارسی، دقیق و مختصر پاسخ بده. اگر اطلاعاتی در متن نیست، حدس نزن و بگو موجود نیست."}];
const PROMPTS = {
  summary:"متن زیر خروجی OCR یک سند است. آن را به صورت خلاصه ساختاریافته (نوع سند، شماره و تاریخ، طرفین، اقلام، مبالغ، نکات مهم) بنویس:",
  proforma:"متن زیر یک پیش‌فاکتور فارسی است؛ ستون‌های جدول با | جدا شده‌اند. فقط یک JSON فشرده در یک خط (بدون فاصله اضافه و بدون توضیح) با این کلیدها برگردان: seller, buyer, number, date, currency, items[{row,code,name,qty,unit,sub_qty,sub_unit,unit_price,total}], total_before_tax, tax, grand_total, payment_terms, delivery_time, validity. قواعد: qty و unit همان «مقدار اصلی» و واحد آن هستند و فی (unit_price) به ازای همین واحد اصلی است؛ «مقدار فرعی» و «واحد فرعی» را در sub_qty و sub_unit بنویس. کد کالا را در code بگذار و داخل name تکرار نکن. همه اعداد را بدون ویرگول و به‌صورت عدد بنویس. مقدار نامشخص را null بگذار. هیچ عددی را حدس نزن و خودت محاسبه نکن:",
  request:"متن زیر خروجی OCR یک درخواست خرید است. فقط یک JSON با کلیدهای number, date, project, requester, priority, items[{name,spec,qty,unit}], notes برگردان. مقدار نامشخص را null بگذار:",
  free:""
};
let busy = false;

function addMsg(role, text){
  const d = document.createElement("div");
  d.className = "msg " + role; d.dir = "auto"; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; return d;
}
function statLine(s){
  const parts = [`${s.total_s} ثانیه`];
  if (s.first_token_s != null) parts.push(`اولین توکن ${s.first_token_s}`);
  if (s.tokens_per_s != null) parts.push(`${s.tokens_per_s} توکن/ثانیه`);
  if (s.resources) parts.push(`RAM ${s.resources.ram_used_gb}GB`, `CPU ${s.resources.cpu_percent}%`);
  return parts.join(" · ");
}

function checkInvoice(text) {
  if (!/"items"/.test(text)) return null;
  const m = text.match(/\{[\s\S]*\}/); if (!m) return "⚠ بررسی خودکار: JSON ناتمام ماند؛ حداکثر توکن را بیشتر کنید.";
  let j; try { j = JSON.parse(m[0]); } catch (e) { return "⚠ بررسی خودکار: JSON کامل یا معتبر نیست (شاید ناتمام ماند؛ حداکثر توکن را بیشتر کنید)."; }
  const num = v => typeof v === "number" ? v : (typeof v === "string" && /^[\d.,]+$/.test(v) ? Number(v.replace(/,/g, "")) : NaN);
  const fmt = v => Math.round(v).toLocaleString("en");
  const bad = [], done = [], items = Array.isArray(j.items) ? j.items : [];
  let sum = 0, sumOk = items.length > 0;
  items.forEach((it, i) => {
    const q = num(it.qty), p = num(it.unit_price), t = num(it.total);
    if (isNaN(t)) sumOk = false; else sum += t;
    if (!isNaN(q) && !isNaN(p) && !isNaN(t)) {
      if (Math.abs(q * p - t) > Math.max(1, t * 1e-6)) bad.push(`ردیف ${it.row ?? i + 1}: تعداد × فی = ${fmt(q * p)} ولی مبلغ ${fmt(t)} است (احتمالاً واحد یا مقدار اصلی/فرعی اشتباه خوانده شده)`);
      else done.push(i);
    }
  });
  const before = num(j.total_before_tax), tax = num(j.tax), grand = num(j.grand_total);
  if (sumOk && !isNaN(before)) { if (Math.abs(sum - before) > 1) bad.push(`جمع مبلغ ردیف‌ها ${fmt(sum)} با جمع قبل از مالیات ${fmt(before)} نمی‌خواند`); else done.push("sum"); }
  if (!isNaN(before) && !isNaN(tax) && !isNaN(grand)) { if (Math.abs(before + tax - grand) > 1) bad.push(`جمع قبل از مالیات + مالیات = ${fmt(before + tax)} ولی جمع کل ${fmt(grand)} است`); else done.push("grand"); }
  if (bad.length) return "⚠ بررسی خودکار حساب‌ها:\n" + bad.join("\n");
  return done.length ? "✓ بررسی خودکار: حساب‌های قابل بررسی (ضرب ردیف‌ها و جمع‌ها) می‌خوانند." : null;
}

async function send(text){
  if (busy || !text.trim()) return;
  busy = true; $("send").disabled = $("toQwen").disabled = true;
  history.push({role:"user", content:text});
  addMsg("user", text);
  const box = addMsg("assistant", "…");
  let out = "", reasoning = "", rBox = null, statEl = null;
  try {
    const res = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({messages: history})});
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i+2);
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === "delta") { out += ev.text; box.textContent = out; }
        else if (ev.type === "reasoning") { reasoning += ev.text; }
        else if (ev.type === "error") { box.className = "msg err"; box.textContent = ev.message; }
        else if (ev.type === "done") { statEl = document.createElement("div"); statEl.className = "stat"; statEl.textContent = statLine(ev.stats); box.appendChild(statEl); }
        $("log").scrollTop = $("log").scrollHeight;
      }
    }
    if (out) history.push({role:"assistant", content:out}); else history.pop();
    if (out) { const c = checkInvoice(out); if (c) { const d = document.createElement("div"); d.className = "stat"; d.style.whiteSpace = "pre-wrap"; d.textContent = c; box.appendChild(d); } }
  } catch (e) { box.className = "msg err"; box.textContent = "خطای ارتباط: " + e; history.pop(); }
  busy = false; $("send").disabled = $("toQwen").disabled = false;
}

$("send").onclick = () => { const t = $("input").value; $("input").value = ""; send(t); };
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); } });
$("clear").onclick = () => { history.length = 1; $("log").innerHTML = ""; };

$("toQwen").onclick = () => {
  const txt = $("ocrText").value.trim(); if (!txt) return;
  const p = PROMPTS[$("task").value];
  send(p ? `${p}\n\n---\n${txt}` : txt);
};

$("ocrBtn").onclick = async () => {
  const f = $("file").files[0]; if (!f) { $("ocrStatus").textContent = "ابتدا یک فایل انتخاب کنید."; return; }
  const ctrl = new AbortController();
  $("ocrBtn").disabled = true; $("ocrStop").style.display = ""; $("ocrStop").onclick = () => ctrl.abort();
  const engine = $("ocrEngine").value; saveCurrent(); activeTab = engine; results[engine] = ""; styleTabs();
  $("ocrText").value = ""; $("ocrStatus").textContent = "ارسال فایل…";
  const fd = new FormData(); fd.append("file", f); fd.append("prompt", $("ocrPrompt").value); fd.append("max_tokens", $("ocrTokens").value); fd.append("pages", $("pages").value || "1"); fd.append("engine", $("ocrEngine").value); fd.append("text_style", $("pdfStyle").value); fd.append("paddle_lang", $("paddleLang").value); fd.append("mode", $("pdfMode").value);
  const parts = []; let cur = "", pages = 0, gotText = false; const t0 = Date.now();
  const sec = () => Math.round((Date.now() - t0) / 1000);
  const show = () => { $("ocrText").value = parts.concat(cur ? [cur] : []).join("\n\n"); $("ocrText").scrollTop = $("ocrText").scrollHeight; };
  const timer = setInterval(() => { if (!gotText && pages) $("ocrStatus").textContent = engine === "paddle" ? `در حال OCR با PaddleOCR… ${sec()} ثانیه` : `در حال پردازش تصویر… ${sec()} ثانیه (روی CPU تا ظاهر شدن اولین کلمه چند دقیقه طبیعی است)`; }, 1000);
  try {
    const res = await fetch("/api/ocr", {method:"POST", body:fd, signal: ctrl.signal});
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i; while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i+1); if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "queued") $("ocrStatus").textContent = "در صف پردازش…";
        else if (ev.type === "start") { pages = ev.pages; gotText = false; }
        else if (ev.type === "status") { $("ocrStatus").textContent = ev.message; }
        else if (ev.type === "delta") { gotText = true; cur += ev.text; show(); $("ocrStatus").textContent = `در حال تولید متن: ${cur.length} کاراکتر · ${sec()} ثانیه`; }
        else if (ev.type === "page") {
          cur = ""; gotText = false;
          parts.push(pages > 1 ? `--- صفحه ${ev.index} ---\n${ev.text}` : ev.text); show();
          $("ocrStatus").textContent = ev.empty
            ? `صفحه ${ev.index}: خروجی خالی بود (توکن تولیدشده: ${ev.completion_tokens}، دلیل توقف: ${ev.finish_reason}، ${ev.seconds} ثانیه)`
            : (ev.source === "paddle" ? `صفحه ${ev.index}: PaddleOCR — ${ev.lines} خط، اطمینان میانگین ${ev.mean_score}، ${ev.seconds} ثانیه` : ev.source === "text-layer" ? `صفحه ${ev.index}: از لایه متنی PDF خوانده شد (بدون OCR)` : `صفحه ${ev.index} از ${pages} تمام شد (${ev.seconds} ثانیه، دلیل توقف: ${ev.finish_reason})`);
        }
        else if (ev.type === "error") { $("ocrStatus").textContent = "خطا: " + ev.message; }
        else if (ev.type === "done") { $("ocrStatus").textContent += ` — کل ${ev.stats.total_s} ثانیه · RAM ${ev.stats.resources.ram_used_gb}GB`; meta[engine] = ev.stats.total_s; }
      }
    }
  } catch (e) { $("ocrStatus").textContent = e.name === "AbortError" ? "متوقف شد (متن تولیدشده تا اینجا حفظ شد)." : "خطا: " + e; }
  clearInterval(timer); $("ocrStop").style.display = "none"; $("ocrBtn").disabled = false;
  results[engine] = $("ocrText").value; styleTabs();
};

async function poll(){
  try {
    const h = await (await fetch("/api/health")).json();
    $("dQwen").className = "dot" + (h.qwen.ok ? " ok" : ""); $("dOcr").className = "dot" + (h.ocr.ok ? " ok" : "");
    $("res").textContent = `RAM ${h.resources.ram_used_gb}GB · CPU ${h.resources.cpu_percent}%`;
  } catch { $("dQwen").className = $("dOcr").className = "dot"; }
}
// ---------- model manager ----------
function fillSelect(sel, list) {
  const sig = list.map(x => x.file).join("|");
  if (sel.dataset.sig === sig) return;
  const cur = sel.value; sel.dataset.sig = sig; sel.innerHTML = "";
  if (!list.length) { const o = document.createElement("option"); o.value = ""; o.textContent = "فایلی در پوشه models پیدا نشد"; sel.appendChild(o); return; }
  for (const x of list) { const o = document.createElement("option"); o.value = x.file; o.textContent = `${x.file} (${x.size_gb} GB)`; sel.appendChild(o); }
  if (cur && [...sel.options].some(o => o.value === cur)) sel.value = cur;
}
function showStat(id, s, errBox) {
  const el = $(id); el.className = "mstat";
  const t = {stopped: "خاموش", external: "از بیرون در حال اجراست (پنجره start_*.bat). برای انتخاب از اینجا آن را ببندید."}[s.state];
  if (t) el.textContent = t;
  else if (s.state === "starting") el.textContent = `در حال بارگذاری ${s.model}… ${s.elapsed_s} ثانیه`;
  else if (s.state === "ready") { el.classList.add("ready"); el.textContent = `آماده ✓ ${s.model}` + (s.load_s ? ` · بارگذاری ${s.load_s} ثانیه` : ""); }
  else if (s.state === "failed") { el.classList.add("failed"); el.textContent = `خطا (کد ${s.exit_code}) — ${s.model}`; errBox.push(s.log_tail || ""); }
}
async function refreshModels() {
  try {
    const m = await (await fetch("/api/models")).json();
    fillSelect($("chatModel"), m.chat); fillSelect($("ocrModel"), m.ocr); fillSelect($("ocrMmproj"), m.mmproj);
    const errs = []; showStat("chatStat", m.servers.chat, errs); showStat("ocrStat", m.servers.ocr, errs);
    for (const [role, sel] of [["chat", "chatModel"], ["ocr", "ocrModel"]]) {
      const s = m.servers[role];
      if (s.model && !$(sel).dataset.touched) { const o = [...$(sel).options].find(o => o.value.split("/").pop() === s.model); if (o) $(sel).value = o.value; }
    }
    if (!$("mErr").dataset.manual) $("mErr").textContent = errs.join("\n");
  } catch (e) { /* server restarting */ }
}
for (const id of ["chatModel", "ocrModel"]) $(id).addEventListener("change", () => { $(id).dataset.touched = "1"; });
async function loadModel(role) {
  const body = role === "chat"
    ? {role, model: $("chatModel").value, ctx: +$("chatCtx").value}
    : {role, model: $("ocrModel").value, mmproj: $("ocrMmproj").value, ctx: +$("ocrCtx").value};
  body.unload_other = !$("keepBoth").checked;
  const r = await fetch("/api/models/load", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  $("mErr").dataset.manual = r.ok ? "" : "1";
  $("mErr").textContent = r.ok ? "" : ((await r.json()).detail || r.status);
  refreshModels();
}
async function unloadModel(role) {
  await fetch("/api/models/unload", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({role})});
  $("mErr").dataset.manual = ""; refreshModels();
}
$("chatLoad").onclick = () => loadModel("chat"); $("ocrLoad").onclick = () => loadModel("ocr");
$("chatUnload").onclick = () => unloadModel("chat"); $("ocrUnload").onclick = () => unloadModel("ocr");
refreshModels(); setInterval(refreshModels, 3000);

// PDF info (page count / text layer) when a file is chosen
$("file").addEventListener("change", async () => {
  const f = $("file").files[0]; $("pdfInfo").textContent = "";
  if (!f || !/\.pdf$/i.test(f.name)) return;
  $("pdfInfo").textContent = "در حال بررسی PDF…";
  const fd = new FormData(); fd.append("file", f);
  try {
    const r = await fetch("/api/pdfinfo", {method: "POST", body: fd}); const j = await r.json();
    $("pdfInfo").textContent = r.ok ? `${j.pages} صفحه · لایه متنی: ${j.has_text_layer ? "دارد (خواندن مستقیم ممکن است)" : "ندارد (اسکن؛ OCR لازم است)"} · هر صفحه OCR چند دقیقه طول می‌کشد` : (j.detail || "خطا");
  } catch (e) { $("pdfInfo").textContent = ""; }
});

// ---------- engine comparison tabs + PaddleOCR ----------
const results = {dots: "", paddle: ""}, meta = {};
let activeTab = "dots";
function saveCurrent() { results[activeTab] = $("ocrText").value; }
function styleTabs() {
  $("tabDots").classList.toggle("active", activeTab === "dots");
  $("tabPaddle").classList.toggle("active", activeTab === "paddle");
  const p = []; if (meta.dots != null) p.push(`Dots: ${meta.dots} ثانیه`); if (meta.paddle != null) p.push(`Paddle: ${meta.paddle} ثانیه`);
  $("cmpInfo").textContent = p.join(" · ");
}
function showTab(t) { saveCurrent(); activeTab = t; $("ocrText").value = results[t]; styleTabs(); }
$("tabDots").onclick = () => showTab("dots"); $("tabPaddle").onclick = () => showTab("paddle");
async function paddleInfo() {
  const isP = $("ocrEngine").value === "paddle";
  $("paddleLang").style.display = isP ? "" : "none"; $("paddleUnload").style.display = isP ? "" : "none";
  $("ocrPrompt").style.display = $("ocrTokens").style.display = isP ? "none" : "";
  if (!isP) return;
  try {
    const s = await (await fetch("/api/paddle/status")).json();
    $("ocrStatus").textContent = !s.installed ? "PaddleOCR نصب نیست — دستور: pip install -r backend\\requirements-paddle.txt (داخل .venv)"
      : (s.loaded ? `PaddleOCR بارگذاری شده است (${s.lang})` : "PaddleOCR نصب است؛ مدل با اولین OCR بارگذاری می‌شود (بار اول ممکن است از اینترنت دانلود کند).");
  } catch (e) { /* ignore */ }
}
$("ocrEngine").addEventListener("change", paddleInfo);
$("paddleUnload").onclick = async () => { await fetch("/api/paddle/unload", {method: "POST"}); paddleInfo(); };

poll(); setInterval(poll, 5000);
</script>
</body>
</html>
