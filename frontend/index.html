<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProcureMind</title>
<style>
/* فونت فقط در همین بخش تعریف می‌شود (:root --font-ui / --font-tech) */
@font-face{font-family:"SG Kara FaNum";font-weight:300;src:url(fonts/SGKara-FaNum-Light.woff2) format("woff2")}
@font-face{font-family:"SG Kara FaNum";font-weight:400;src:url(fonts/SGKara-FaNum-Regular.woff2) format("woff2")}
@font-face{font-family:"SG Kara FaNum";font-weight:600;src:url(fonts/SGKara-FaNum-SemiBold.woff2) format("woff2")}
@font-face{font-family:"SG Kara FaNum";font-weight:700;src:url(fonts/SGKara-FaNum-Bold.woff2) format("woff2")}
@font-face{font-family:"SG Kara";font-weight:300;src:url(fonts/SGKara-Std-Light.woff2) format("woff2")}
@font-face{font-family:"SG Kara";font-weight:400;src:url(fonts/SGKara-Std-Regular.woff2) format("woff2")}
@font-face{font-family:"SG Kara";font-weight:600;src:url(fonts/SGKara-Std-SemiBold.woff2) format("woff2")}
@font-face{font-family:"SG Kara";font-weight:700;src:url(fonts/SGKara-Std-Bold.woff2) format("woff2")}
:root{
  --font-ui:"SG Kara FaNum",Tahoma,system-ui,sans-serif;   /* ارقام فارسی */
  --font-tech:"SG Kara",Tahoma,system-ui,sans-serif;        /* ارقام لاتین: شناسه، شماره حساب، مدل */
  --bg:#f4f5f7;--panel:#fff;--text:#1b1f24;--muted:#6b7280;--line:#e2e5ea;
  --accent:#1f6feb;--user:#e8f0fe;--bot:#f1f3f5;--ok:#1a9a4a;--bad:#d1242f;
}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--panel:#1d2127;--text:#e7e9ec;--muted:#9aa3ad;--line:#2d333b;--accent:#4c8dff;--user:#1f3350;--bot:#262c33}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:15px}
.tech,code,.ltr{font-family:var(--font-tech);direction:ltr;unicode-bidi:embed}
header{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700}
header .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.dot.ok{background:var(--ok)}
button,select,input,textarea{font-family:inherit;font-size:14px;color:var(--text)}
button{cursor:pointer;border:0;border-radius:8px;padding:7px 14px;background:var(--accent);color:#fff}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
select,input[type=text],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.drawer{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.drawer[hidden]{display:none}
.drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drow b{min-width:78px}
.drow select{max-width:330px}
.mstat{font-size:12px;color:var(--muted)}
.mstat.ready{color:var(--ok)} .mstat.failed{color:var(--bad)}
#mErr{margin:0;font-size:11px;color:var(--bad);white-space:pre-wrap;max-height:90px;overflow:auto;direction:ltr;text-align:left}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
#log>*{width:100%;max-width:880px}
.empty{color:var(--muted);text-align:center;margin-top:60px;line-height:2}
.msg{max-width:88%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;line-height:1.9;word-break:break-word}
.msg.user{background:var(--user);align-self:flex-start}
.msg.assistant{background:var(--bot);align-self:flex-end}
.msg.err{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.msgchip{display:inline-block;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin-bottom:4px}
.stat{font-size:11px;color:var(--muted);margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.chead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmeta{font-size:12px;color:var(--muted);flex:1}
.ctext{width:100%;min-height:150px;max-height:380px;resize:vertical;line-height:1.9}
.cacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.composer{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.composer>*{width:100%;max-width:880px}
.opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.opts label{display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.opts input[type=text]{width:70px}
.chips:empty{display:none}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px}
.chip button{padding:0 7px;border-radius:50%;background:transparent;color:var(--muted);border:0}
.inputrow{display:flex;gap:8px;align-items:flex-end}
.inputrow textarea{flex:1;resize:none;height:58px}
.plus{width:40px;height:40px;border-radius:50%;padding:0;font-size:22px;line-height:1}
</style>
</head>
<body>
<header>
  <h1>ProcureMind</h1>
  <span class="pill"><span class="dot" id="dQwen"></span>مدل چت</span>
  <span class="pill"><span class="dot" id="dOcr"></span>مدل OCR</span>
  <span class="pill" id="res"></span>
  <span class="pill tech" id="ver" title="نسخه‌ی برنامه"></span>
  <span class="sp"></span>
  <button class="sec" id="drawerBtn">⚙ مدل‌ها و تنظیمات</button>
  <button class="sec" id="clear">گفتگوی جدید</button>
</header>

<div class="drawer" id="drawer" hidden>
  <div class="drow">
    <b>مدل چت</b>
    <select id="chatCtx" title="طول context (کمتر = RAM کمتر)"><option value="2048">ctx 2048</option><option value="4096" selected>ctx 4096</option><option value="8192">ctx 8192</option></select>
    <button class="sec" id="chatUnload">خاموش</button>
    <span class="mstat">(انتخاب مدل چت از نوار پایین صفحه)</span>
  </div>
  <div class="drow">
    <b>مدل OCR / بینایی</b>
    <select id="ocrModel"></select>
    <select id="ocrMmproj" title="فایل mmproj (بخش بینایی)"></select>
    <select id="ocrCtx" title="طول context"><option value="4096">ctx 4096</option><option value="8192" selected>ctx 8192</option><option value="16384">ctx 16384</option></select>
    <button id="ocrLoad">بارگذاری</button><button class="sec" id="ocrUnload">خاموش</button>
    <span class="mstat" id="ocrStat">—</span>
  </div>
  <div class="drow">
    <b>تنظیم Dots</b>
    <select id="ocrPrompt">
      <option value="Extract the text content from this image.">فقط متن (پیش‌فاکتور: پیش‌فرض)</option>
      <option value="Extract all text from this image and preserve structure in markdown.">متن با ساختار (مارک‌داون)</option>
    </select>
    <select id="ocrTokens" title="حداکثر طول خروجی">
      <option value="256">حداکثر ۲۵۶ توکن</option><option value="512" selected>حداکثر ۵۱۲ توکن</option>
      <option value="1024">حداکثر ۱۰۲۴ توکن</option><option value="2048">حداکثر ۲۰۴۸ توکن</option>
    </select>
  </div>
  <div class="drow">
    <b>PaddleOCR</b>
    <select id="paddleLang"><option value="fa">فارسی (fa)</option><option value="ar">عربی (ar)</option><option value="en">انگلیسی (en)</option></select>
    <button class="sec" id="paddleUnload">آزاد کردن حافظه</button>
    <span class="mstat" id="paddleStat"></span>
  </div>
  <div class="drow">
    <b>نام شما</b>
    <input type="text" id="userName" placeholder="مثلاً رضا" maxlength="30">
    <span class="mstat">برای سلام و احوال‌پرسی گرم (فقط در همین مرورگر ذخیره می‌شود؛ بعداً با حساب کاربری و ترجیحات)</span>
  </div>
  <label class="mstat"><input type="checkbox" id="keepBoth"> هر دو مدل (چت و OCR) هم‌زمان در RAM بمانند (حافظه زیاد لازم است؛ پیش‌فرض: با بارگذاری یکی، دیگری خاموش می‌شود)</label>
  <pre id="mErr"></pre>
</div>

<main id="log"></main>

<footer class="composer">
  <div class="chips" id="chips"></div>
  <div class="opts">
    <label>مدل چت <select id="chatModel"></select></label>
    <button class="sec" id="chatLoad">بارگذاری</button>
    <span class="mstat" id="chatStat">—</span>
  </div>
  <div class="opts">
    <label>خواندن فایل
      <select id="method" title="روش استخراج متن از فایل پیوست‌شده">
        <option value="text">لایه متنی PDF (فوری؛ برای PDF دیجیتال)</option>
        <option value="manual">دستی (متن را خودم می‌چسبانم، مثلاً از Google Lens)</option>
        <option value="dots">OCR با مدل بینایی (Dots یا هر مدل بینایی؛ کند)</option>
        <option value="paddle">PaddleOCR (سریع؛ فارسی ضعیف)</option>
      </select>
    </label>
    <span id="pdfOpts" hidden>
      <label>صفحه‌ها <input type="text" id="pages" value="1" title="مثلاً 1 یا 1-3,5 یا all (حداکثر ۱۰ صفحه)"></label>
      <select id="textStyle" title="روش خواندن لایه متنی">
        <option value="layout">لایه متنی: مرتب‌شده (راست‌به‌چپ + جدول)</option>
        <option value="raw">لایه متنی: خام</option>
      </select>
    </span>
    <label><input type="checkbox" id="autoAnalyze" checked> تحلیل خودکار بعد از استخراج</label>
  </div>
  <div class="inputrow">
    <button class="plus" id="plus" title="پیوست فایل (تصویر یا PDF)">+</button>
    <input type="file" id="file" accept="image/*,.pdf" hidden>
    <textarea id="input" placeholder="پیام بنویسید… با «+» تصویر یا PDF پیوست کنید (Enter = ارسال، Shift+Enter = خط جدید)"></textarea>
    <button id="send">ارسال</button>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const SYSTEM = {role: "system", content: ""};  // placeholder at history[0]; the real system message is built per request
const SYSTEM_TASK = {role: "system", content: "تو دستیار دقیق تدارکات هستی. فقط طبق دستور پاسخ بده و هیچ عددی را حدس نزن."};
function userName() { try { return (localStorage.getItem("pm_user_name") || "").trim(); } catch (e) { return ""; } }
function systemChat() {
  const n = userName();
  return {role: "system", content: "تو «دستیار پروماین»، دستیار هوشمند بخش تدارکات و بازرگانی هستی. فارسی روان، گرم، صمیمی و محترمانه صحبت کن" +
    (n ? `؛ نام کاربر «${n}» است و در سلام و احوال‌پرسی او را با نام صدا بزن (مثلاً «سلام ${n} جان! خوبی؟ امروز چه کمکی از دستم برمی‌آید؟»)` : "") +
    ". پاسخ‌ها کوتاه و دقیق باشند. اگر اطلاعاتی نداری حدس نزن و بگو نمی‌دانم. هرگز عدد مالی را از خودت نساز."};
}
let history = [SYSTEM], attached = null, busy = false, autoTouched = false;

const PROMPTS = {
  summary: "متن زیر خروجی یک سند است. آن را به صورت خلاصه ساختاریافته (نوع سند، شماره و تاریخ، طرفین، اقلام، مبالغ، نکات مهم) بنویس:",
  proforma: "متن زیر یک پیش‌فاکتور فارسی است؛ ستون‌های جدول با | جدا شده‌اند. فقط یک JSON فشرده در یک خط (بدون فاصله اضافه و بدون توضیح) با این کلیدها برگردان: seller, buyer, number, date, currency, items[{row,code,name,qty,unit,sub_qty,sub_unit,unit_price,total}], total_before_tax, tax, grand_total, payment_terms, delivery_time, validity. قواعد: qty و unit همان «مقدار اصلی» و واحد آن هستند و فی (unit_price) به ازای همین واحد اصلی است؛ «مقدار فرعی» و «واحد فرعی» را در sub_qty و sub_unit بنویس. کد کالا را در code بگذار و داخل name تکرار نکن. همه اعداد را بدون ویرگول و به‌صورت عدد بنویس. مقدار نامشخص را null بگذار. هیچ عددی را حدس نزن و خودت محاسبه نکن:",
  request: "متن زیر یک درخواست خرید است. فقط یک JSON فشرده با کلیدهای number, date, project, requester, priority, items[{name,spec,qty,unit}], notes برگردان. مقدار نامشخص را null بگذار:"
};
const TASKS = {auto: "تشخیص خودکار نوع سند و انجام کار مناسب (پیشنهادی)", ask: "پرسش من", summary: "خلاصه ساختاریافته", hybrid: "پیش‌فاکتور — ترکیبی (جدول با کد، سربرگ با مدل؛ سریع)", proforma: "پیش‌فاکتور — کامل با مدل (کند)", request: "JSON درخواست خرید"};
const HEADER_PROMPT = "متن زیر سربرگ یک پیش‌فاکتور فارسی است. فروشنده شرکتی است که پیش‌فاکتور را صادر کرده و نامش بالای سند و قبل از بخش «خریدار» آمده؛ خریدار نامی است که بعد از برچسب «خریدار» می‌آید. فقط یک JSON فشرده در یک خط با دو کلید seller و buyer برگردان و نام‌ها را دقیقاً مثل متن کپی کن. اگر مطمئن نیستی null بگذار:";

// ---------- helpers ----------
function normalizeFa(s) {
  const dig = {"۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9","٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9"};
  return s.normalize("NFKC").replace(/[۰-۹٠-٩]/g, d => dig[d]).replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/ـ/g, "")
          .replace(/٬/g, ",").replace(/٫/g, ".").replace(/[ \t]+\n/g, "\n");
}
function statLine(s) {
  const p = [`${s.total_s} ثانیه`];
  if (s.model) p.unshift(s.model);
  if (s.first_token_s != null) p.push(`اولین توکن ${s.first_token_s}`);
  if (s.tokens_per_s != null) p.push(`${s.tokens_per_s} توکن/ثانیه`);
  if (s.resources) p.push(`RAM ${s.resources.ram_used_gb}GB`, `CPU ${s.resources.cpu_percent}%`);
  return p.join(" · ");
}
function checkInvoice(text) {
  if (!/"items"/.test(text)) return null;
  const m = text.match(/\{[\s\S]*\}/); if (!m) return "⚠ بررسی خودکار: JSON ناتمام ماند؛ حداکثر توکن را بیشتر کنید.";
  let j; try { j = JSON.parse(m[0]); } catch (e) { return "⚠ بررسی خودکار: JSON کامل یا معتبر نیست (شاید ناتمام ماند؛ حداکثر توکن را بیشتر کنید)."; }
  const num = v => typeof v === "number" ? v : (typeof v === "string" && /^[\d.,]+$/.test(v) ? Number(v.replace(/,/g, "")) : NaN);
  const fmt = v => Math.round(v).toLocaleString("en");
  const bad = [], done = [], items = Array.isArray(j.items) ? j.items : [];
  let sum = 0, sumOk = items.length > 0;
  items.forEach((it, i) => {
    const q = num(it.qty), p = num(it.unit_price), t = num(it.total);
    if (isNaN(t)) sumOk = false; else sum += t;
    if (!isNaN(q) && !isNaN(p) && !isNaN(t)) {
      if (Math.abs(q * p - t) > Math.max(1, t * 1e-6)) bad.push(`ردیف ${it.row ?? i + 1}: تعداد × فی = ${fmt(q * p)} ولی مبلغ ${fmt(t)} است (احتمالاً واحد یا مقدار اصلی/فرعی اشتباه خوانده شده)`);
      else done.push(i);
    }
  });
  const before = num(j.total_before_tax), tax = num(j.tax), grand = num(j.grand_total);
  if (sumOk && !isNaN(before)) { if (Math.abs(sum - before) > 1) bad.push(`جمع مبلغ ردیف‌ها ${fmt(sum)} با جمع قبل از مالیات ${fmt(before)} نمی‌خواند`); else done.push("sum"); }
  if (!isNaN(before) && !isNaN(tax) && !isNaN(grand)) { if (Math.abs(before + tax - grand) > 1) bad.push(`جمع قبل از مالیات + مالیات = ${fmt(before + tax)} ولی جمع کل ${fmt(grand)} است`); else done.push("grand"); }
  if (bad.length) return "⚠ بررسی خودکار حساب‌ها:\n" + bad.join("\n");
  return done.length ? "✓ بررسی خودکار: حساب‌های قابل بررسی (ضرب ردیف‌ها و جمع‌ها) می‌خوانند." : null;
}
function scrollDown() { const l = $("log"); l.scrollTop = l.scrollHeight; }
function clearEmpty() { const e = $("log").querySelector(".empty"); if (e) e.remove(); }
function showEmpty() { const n = userName(); $("log").innerHTML = '<div class="empty">' + (n ? `سلام ${n} جان!` : "سلام!") + ' یک پیام بنویسید یا با «+» پیش‌فاکتور (PDF یا عکس) پیوست کنید.<br>ابتدا از «⚙ مدل‌ها و تنظیمات» و نوار پایین مدل‌ها را بارگذاری کنید.</div>'; }
function addMsg(role, text, chipText) {
  clearEmpty();
  const d = document.createElement("div"); d.className = "msg " + role; d.dir = "auto";
  if (chipText) { const c = document.createElement("div"); c.className = "msgchip"; c.textContent = "📎 " + chipText; d.appendChild(c); d.appendChild(document.createElement("br")); }
  const t = document.createElement("span"); t.className = "mtext"; t.textContent = text; d.appendChild(t);
  $("log").appendChild(d); scrollDown(); return d;
}
function setBusy(b) { busy = b; $("send").disabled = b; }

// ---------- chat with the model ----------
async function askModel({prompt, bubble, maxTokens = 1024, fresh = false}) {
  if (busy) return false;
  setBusy(true);
  if (bubble) addMsg("user", bubble);
  const msgs = fresh ? [SYSTEM_TASK, {role: "user", content: prompt}] : [systemChat(), ...history.slice(1).slice(-6), {role: "user", content: prompt}];  // only the last 6 messages (small context)
  const box = addMsg("assistant", "…"), txt = box.querySelector(".mtext");
  let out = "";
  try {
    const res = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({messages: msgs, max_tokens: maxTokens})});
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === "delta") { out += ev.text; txt.textContent = out; }
        else if (ev.type === "error") { box.className = "msg err"; txt.textContent = ev.message; }
        else if (ev.type === "done") { const s = document.createElement("div"); s.className = "stat"; s.textContent = statLine(ev.stats); box.appendChild(s); }
        scrollDown();
      }
    }
    if (out) {
      history.push({role: "user", content: prompt}, {role: "assistant", content: out});
      const c = checkInvoice(out);
      if (c) { const d = document.createElement("div"); d.className = "stat"; d.style.whiteSpace = "pre-wrap"; d.textContent = c; box.appendChild(d); }
    }
  } catch (e) { box.className = "msg err"; txt.textContent = "خطای ارتباط: " + e; }
  setBusy(false);
  return out;
}

// ---------- attachment ----------
function clearAttachment() { attached = null; $("chips").innerHTML = ""; $("pdfOpts").hidden = true; $("file").value = ""; }
async function attach(file) {
  attached = file;
  const chip = document.createElement("span"); chip.className = "chip";
  const label = document.createElement("span"); label.textContent = `📎 ${file.name} (${Math.max(1, Math.round(file.size / 1024))} KB)`;
  const x = document.createElement("button"); x.textContent = "✕"; x.title = "حذف پیوست"; x.onclick = clearAttachment;
  chip.append(label, x); $("chips").innerHTML = ""; $("chips").appendChild(chip);
  const isPdf = /\.pdf$/i.test(file.name);
  $("pdfOpts").hidden = !isPdf;
  if (!isPdf && $("method").value === "text") { $("method").value = "manual"; syncAuto(); label.textContent += " — عکس لایه متنی ندارد؛ روش «دستی» انتخاب شد"; }
  if (isPdf) {
    try {
      const fd = new FormData(); fd.append("file", file);
      const r = await fetch("/api/pdfinfo", {method: "POST", body: fd}); const j = await r.json();
      if (r.ok) {
        label.textContent += ` — ${j.pages} صفحه، لایه متنی: ${j.has_text_layer ? "دارد" : "ندارد (اسکن)"}`;
        if (!j.has_text_layer && $("method").value === "text") { $("method").value = "manual"; syncAuto(); label.textContent += " ← روش «دستی» انتخاب شد"; }
      }
    } catch (e) { /* ignore */ }
  }
}
$("plus").onclick = () => $("file").click();
$("file").onchange = () => { const f = $("file").files[0]; if (f) attach(f); };
function syncAuto() { if (!autoTouched) $("autoAnalyze").checked = $("method").value === "text"; }
$("autoAnalyze").onchange = () => { autoTouched = true; };
$("method").onchange = syncAuto;

// ---------- extraction cards ----------
function buildPrompt(task, text, msg) {
  if (task === "ask") return (msg || "متن زیر را بررسی کن و نکات مهم آن را بگو:") + "\n\n---\n" + text;
  return PROMPTS[task] + "\n\n---\n" + text;
}
function createCard(file, method, msg) {
  clearEmpty();
  const el = document.createElement("div"); el.className = "card";
  const names = {text: "لایه متنی PDF", manual: "دستی", dots: "Dots OCR", paddle: "PaddleOCR"};
  el.innerHTML = '<div class="chead"><b></b><span class="cmeta"></span><button class="sec stop" hidden>توقف</button></div><textarea class="ctext" dir="auto"></textarea><div class="cacts"><select class="task"></select><button class="analyze">ارسال به مدل</button><button class="sec norm">نرمال‌سازی متن</button><button class="sec copy">کپی</button></div>';
  el.querySelector("b").textContent = `📄 ${file.name} — ${names[method]}`;
  const ta = el.querySelector(".ctext"), meta = el.querySelector(".cmeta"), stop = el.querySelector(".stop"), sel = el.querySelector(".task");
  for (const [k, v] of Object.entries(TASKS)) { const o = document.createElement("option"); o.value = k; o.textContent = v; sel.appendChild(o); }
  sel.value = msg ? "ask" : "auto";
  const card = {el, ta, msg, file, method, setStatus: t => { meta.textContent = t; }, stop, ctrl: null};
  el.querySelector(".norm").onclick = () => { ta.value = normalizeFa(ta.value); card.setStatus("متن نرمال‌سازی شد."); };
  el.querySelector(".copy").onclick = () => navigator.clipboard && navigator.clipboard.writeText(ta.value);
  el.querySelector(".analyze").onclick = () => analyze(card, false);
  card.task = sel;
  $("log").appendChild(el); scrollDown();
  return card;
}
async function analyze(card, auto) {
  const txt = card.ta.value.trim();
  if (!txt) { card.setStatus("متنی برای ارسال نیست؛ ابتدا متن را وارد یا استخراج کنید."); return; }
  let task = card.task.value;
  if (task === "auto") { task = await classifyAndPick(card, txt, auto); if (!task) return; }
  if (task === "hybrid") { await analyzeHybrid(card, txt, auto); return; }
  const bubble = auto ? null : (task === "ask" && card.msg ? card.msg : `▶ ${TASKS[task]}`);
  card.setStatus("در حال ارسال به مدل…");
  await askModel({prompt: buildPrompt(task, txt, card.msg), bubble, maxTokens: (task === "proforma" || task === "request") ? 2048 : 1024, fresh: true});
  card.setStatus("تحلیل انجام شد؛ می‌توانید متن را اصلاح و دوباره ارسال کنید.");
}
const AUTO_TASK = {proforma: "hybrid", purchase_request: "request"};
let futureNoteShown = false;
async function classifyAndPick(card, txt, auto) {
  let c;
  try {
    const r = await fetch("/api/classify", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text: txt})});
    c = await r.json(); if (!r.ok) throw new Error(c.detail || r.status);
  } catch (e) { const b = addMsg("assistant", "خطا در تشخیص نوع سند: " + e); b.className = "msg err"; return null; }
  if (!auto) addMsg("user", "▶ تشخیص خودکار نوع سند");
  const task = AUTO_TASK[c.type] || "summary";
  let m = c.type === "other" ? "نوع سند را مطمئن تشخیص ندادم؛ یک خلاصه‌ی ساختاریافته تهیه می‌کنم."
    : `نوع سند: ${c.label} (اطمینان ${Math.round(c.confidence * 100)}٪)` + (c.evidence.length ? ` — شواهد: ${c.evidence.join("، ")}` : "") + `\nکار مناسب: ${TASKS[task]}`;
  if (c.type === "proforma" && !futureNoteShown) { futureNoteShown = true; m += "\nبعد از ساخت جدول‌های فروشنده و پیش‌فاکتور (فاز ۳ و ۵)، همین‌جا فروشنده را در بانک اطلاعاتی جست‌وجو می‌کنم و ثبت یا به‌روزرسانی را به شما پیشنهاد می‌دهم؛ فعلاً فقط استخراج انجام می‌شود."; }
  addMsg("assistant", m);
  card.task.value = task;
  return task;
}
async function analyzeHybrid(card, txt, auto) {
  if (busy) return;
  card.setStatus("خواندن جدول با کد…");
  let p;
  try {
    const r = await fetch("/api/invoice/parse", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text: txt})});
    p = await r.json(); if (!r.ok) throw new Error(p.detail || r.status);
  } catch (e) { const b = addMsg("assistant", "خطا در خواندن جدول: " + e); b.className = "msg err"; return; }
  if (!auto) addMsg("user", "▶ " + TASKS.hybrid);
  if (!p.items.length) { addMsg("assistant", "جدول اقلام پیدا نشد (ردیفی که «تعداد × فی = مبلغ» در آن برقرار باشد). متن را اصلاح کنید یا «پیش‌فاکتور — کامل با مدل» را بزنید." + (p.problems.length ? "\n" + p.problems.join("\n") : "")); card.setStatus("جدول پیدا نشد."); return; }
  const base = {items: p.items, total_before_tax: p.totals.total_before_tax, tax: p.totals.tax, grand_total: p.totals.grand_total};
  const box = addMsg("assistant", "اقلام و جمع‌ها (خوانده‌شده با کد، بدون مدل زبانی):\n" + JSON.stringify(base, null, 1));
  const notes = [...p.problems]; const c = checkInvoice(JSON.stringify(base)); if (c) notes.push(c);
  if (notes.length) { const d = document.createElement("div"); d.className = "stat"; d.style.whiteSpace = "pre-wrap"; d.textContent = notes.join("\n"); box.appendChild(d); }
  let hdr = {};
  if (p.header_text.trim()) {
    card.setStatus("خواندن سربرگ با مدل…");
    const out = await askModel({prompt: HEADER_PROMPT + "\n\n---\n" + (p.header_for_model || p.header_text), bubble: null, maxTokens: 200, fresh: true});
    const i0 = out ? out.indexOf("{") : -1;
    if (i0 >= 0) {
      const i1 = out.lastIndexOf("}");
      for (const cand of [i1 > i0 ? out.slice(i0, i1 + 1) : "", out.slice(i0) + "}"]) {  // second candidate repairs a cut-off answer
        if (!cand) continue;
        try { hdr = JSON.parse(cand); break; } catch (e) { /* try next */ }
      }
    }
  }
  let chk;
  try {
    const r2 = await fetch("/api/invoice/header-check", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({header_text: p.header_text, full_text: txt, model: hdr})});
    chk = await r2.json(); if (!r2.ok) throw new Error(chk.detail || r2.status);
  } catch (e) { const b2 = addMsg("assistant", "خطا در بررسی سربرگ: " + e); b2.className = "msg err"; return; }
  const merged = {...chk.header, ...base};
  rememberInvoice(merged);
  const fin = addMsg("assistant", "نتیجه نهایی (جدول، شماره، تاریخ، ارز و خریدار از کد؛ فروشنده از مدل پس از تطبیق با سند):\n" + JSON.stringify(merged, null, 1));
  const notes2 = [...chk.warnings]; const c2 = checkInvoice(JSON.stringify(merged)); if (c2) notes2.push(c2);
  if (notes2.length) { const d = document.createElement("div"); d.className = "stat"; d.style.whiteSpace = "pre-wrap"; d.textContent = notes2.join("\n"); fin.appendChild(d); }
  card.setStatus(chk.warnings.length ? "تحلیل انجام شد؛ هشدارها را ببینید." : "تحلیل انجام شد.");
}
async function runExtraction(card) {
  const {file, method} = card;
  const ctrl = new AbortController(); card.ctrl = ctrl; card.stop.hidden = false; card.stop.onclick = () => ctrl.abort();
  const fd = new FormData(); fd.append("file", file);
  fd.append("engine", method); fd.append("mode", method === "text" ? "auto" : "ocr");
  fd.append("pages", $("pages").value || "1"); fd.append("text_style", $("textStyle").value);
  fd.append("paddle_lang", $("paddleLang").value); fd.append("prompt", $("ocrPrompt").value); fd.append("max_tokens", $("ocrTokens").value);
  const parts = []; let cur = "", pages = 0, gotText = false, noLayer = false, failed = false; const t0 = Date.now();
  const sec = () => Math.round((Date.now() - t0) / 1000);
  const show = () => { card.ta.value = parts.concat(cur ? [cur] : []).join("\n\n"); card.ta.scrollTop = card.ta.scrollHeight; };
  const timer = setInterval(() => { if (!gotText && pages && method !== "text") card.setStatus(method === "paddle" ? `در حال OCR با PaddleOCR… ${sec()} ثانیه` : `در حال پردازش تصویر… ${sec()} ثانیه (روی CPU تا اولین کلمه چند دقیقه طبیعی است)`); }, 1000);
  card.setStatus("ارسال فایل…");
  try {
    const res = await fetch("/api/ocr", {method: "POST", body: fd, signal: ctrl.signal});
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i; while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "queued") card.setStatus("در صف پردازش…");
        else if (ev.type === "start") { pages = ev.pages; gotText = false; }
        else if (ev.type === "status") card.setStatus(ev.message);
        else if (ev.type === "delta") { gotText = true; cur += ev.text; show(); card.setStatus(`در حال تولید متن: ${cur.length} کاراکتر · ${sec()} ثانیه`); }
        else if (ev.type === "page") {
          cur = ""; gotText = false;
          if (ev.source === "no-text-layer") { noLayer = true; card.setStatus(`صفحه ${ev.index}: لایه متنی ندارد (اسکن یا عکس است)`); continue; }
          parts.push(pages > 1 ? `--- صفحه ${ev.index} ---\n${ev.text}` : ev.text); show();
          card.setStatus(ev.source === "paddle" ? `صفحه ${ev.index}: PaddleOCR — ${ev.lines} خط، اطمینان میانگین ${ev.mean_score}، ${ev.seconds} ثانیه`
            : ev.source === "text-layer" ? `صفحه ${ev.index}: از لایه متنی PDF خوانده شد`
            : ev.empty ? `صفحه ${ev.index}: خروجی خالی بود (توکن: ${ev.completion_tokens}، دلیل توقف: ${ev.finish_reason})`
            : `صفحه ${ev.index} از ${pages} تمام شد (${ev.seconds} ثانیه)`);
        }
        else if (ev.type === "error") {
          failed = true; card.setStatus("خطا: " + ev.message);
          if (/مدل OCR آماده نیست/.test(ev.message)) $("drawer").hidden = false;
        }
        else if (ev.type === "done") card.setStatus(card.el.querySelector(".cmeta").textContent + ` — کل ${ev.stats.total_s} ثانیه`);
      }
    }
  } catch (e) { failed = true; card.setStatus(e.name === "AbortError" ? "متوقف شد (متن تا اینجا حفظ شد)." : "خطا: " + e); }
  clearInterval(timer); card.stop.hidden = true;
  if (noLayer && !card.ta.value.trim()) card.setStatus("این فایل لایه متنی ندارد؛ روش «دستی» (Google Lens) یا یکی از OCRها را انتخاب کنید.");
  if (!failed && card.ta.value.trim()) {
    if ($("autoAnalyze").checked) await analyze(card, true);
    else card.setStatus(card.el.querySelector(".cmeta").textContent + " — متن را بررسی/اصلاح کنید و «ارسال به مدل» را بزنید.");
  }
}

// ---------- sending ----------
let lastInvoice = null;
function rememberInvoice(inv) {
  lastInvoice = inv;
  const slim = {...inv, items: inv.items.map(({row, name, qty, unit, unit_price, total, tax}) => ({row, name, qty, unit, unit_price, total, tax}))};
  history.push({role: "user", content: "[اطلاعات استخراج‌شده از پیش‌فاکتور برای پاسخ به سؤال‌های بعدی]"}, {role: "assistant", content: JSON.stringify(slim)});
}
async function tryInvoiceQuery(text) {
  try {
    const r = await fetch("/api/invoice/query", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question: text, invoice: lastInvoice})});
    const j = await r.json();
    if (!r.ok || !j.handled) return false;
    addMsg("user", text);
    const b = addMsg("assistant", j.answer);
    const s = document.createElement("div"); s.className = "stat"; s.textContent = "محاسبه با کد از اطلاعات پیش‌فاکتور آخر"; b.appendChild(s);
    history.push({role: "user", content: text}, {role: "assistant", content: j.answer});
    return true;
  } catch (e) { return false; }
}
async function handleSend() {
  const text = $("input").value.trim(), file = attached;
  if (!file) {
    if (!text || busy) return; $("input").value = "";
    if (lastInvoice && await tryInvoiceQuery(text)) return;  // exact answers from the extracted data, no model needed
    await askModel({prompt: text, bubble: text}); return;
  }
  if (busy) return;
  const method = $("method").value;
  $("input").value = ""; clearAttachment();
  addMsg("user", text || "(بدون پیام)", file.name);
  const card = createCard(file, method, text);
  if (method === "manual") {
    const fd = new FormData(); fd.append("file", file); fetch("/api/upload", {method: "POST", body: fd}).catch(() => {});  // keep the original
    card.setStatus("متن فایل را (مثلاً از Google Lens) در کادر بچسبانید و «ارسال به مدل» را بزنید.");
    card.ta.placeholder = "متن را اینجا بچسبانید…"; card.ta.focus();
    return;
  }
  await runExtraction(card);
}
$("send").onclick = handleSend;
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); } });
$("clear").onclick = () => { history = [SYSTEM]; lastInvoice = null; showEmpty(); clearAttachment(); };
$("drawerBtn").onclick = () => { $("drawer").hidden = !$("drawer").hidden; };

// ---------- model manager ----------
function fillSelect(sel, list) {
  const sig = list.map(x => x.file).join("|");
  if (sel.dataset.sig === sig) return;
  const cur = sel.value; sel.dataset.sig = sig; sel.innerHTML = "";
  if (!list.length) { const o = document.createElement("option"); o.value = ""; o.textContent = "فایلی در پوشه models پیدا نشد"; sel.appendChild(o); return; }
  for (const x of list) { const o = document.createElement("option"); o.value = x.file; o.textContent = `${x.file} (${x.size_gb} GB)`; sel.appendChild(o); }
  if (cur && [...sel.options].some(o => o.value === cur)) sel.value = cur;
}
function showStat(id, s, errBox) {
  const el = $(id); el.className = "mstat";
  const t = {stopped: "خاموش", external: "از بیرون در حال اجراست (پنجره start_*.bat). برای انتخاب از اینجا آن را ببندید."}[s.state];
  if (t) el.textContent = t;
  else if (s.state === "starting") el.textContent = `در حال بارگذاری ${s.model}… ${s.elapsed_s} ثانیه`;
  else if (s.state === "ready") { el.classList.add("ready"); el.textContent = `آماده ✓ ${s.model}` + (s.load_s ? ` · بارگذاری ${s.load_s} ثانیه` : ""); }
  else if (s.state === "failed") { el.classList.add("failed"); el.textContent = `خطا (کد ${s.exit_code}) — ${s.model}`; errBox.push(s.log_tail || ""); }
}
async function refreshModels() {
  try {
    const m = await (await fetch("/api/models")).json();
    fillSelect($("chatModel"), m.chat); fillSelect($("ocrModel"), m.ocr); fillSelect($("ocrMmproj"), m.mmproj);
    const errs = []; showStat("chatStat", m.servers.chat, errs); showStat("ocrStat", m.servers.ocr, errs);
    for (const [role, sel] of [["chat", "chatModel"], ["ocr", "ocrModel"]]) {
      const s = m.servers[role];
      if (s.model && !$(sel).dataset.touched) { const o = [...$(sel).options].find(o => o.value.split("/").pop() === s.model); if (o) $(sel).value = o.value; }
    }
    if (!$("mErr").dataset.manual) $("mErr").textContent = errs.join("\n");
  } catch (e) { /* server restarting */ }
}
for (const id of ["chatModel", "ocrModel"]) $(id).addEventListener("change", () => { $(id).dataset.touched = "1"; });
async function loadModel(role) {
  const body = role === "chat"
    ? {role, model: $("chatModel").value, ctx: +$("chatCtx").value}
    : {role, model: $("ocrModel").value, mmproj: $("ocrMmproj").value, ctx: +$("ocrCtx").value};
  body.unload_other = !$("keepBoth").checked;
  const r = await fetch("/api/models/load", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  $("mErr").dataset.manual = r.ok ? "" : "1";
  $("mErr").textContent = r.ok ? "" : ((await r.json()).detail || r.status);
  if (!r.ok) $("drawer").hidden = false;
  refreshModels();
}
async function unloadModel(role) {
  await fetch("/api/models/unload", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({role})});
  $("mErr").dataset.manual = ""; refreshModels();
}
$("chatLoad").onclick = () => loadModel("chat"); $("ocrLoad").onclick = () => loadModel("ocr");
$("chatUnload").onclick = () => unloadModel("chat"); $("ocrUnload").onclick = () => unloadModel("ocr");
$("paddleUnload").onclick = async () => { await fetch("/api/paddle/unload", {method: "POST"}); paddleInfo(); };
async function paddleInfo() {
  try {
    const s = await (await fetch("/api/paddle/status")).json();
    $("paddleStat").textContent = !s.installed ? "نصب نیست (pip install -r backend\\requirements-paddle.txt)" : (s.loaded ? `بارگذاری‌شده (${s.lang})` : "نصب است؛ با اولین استفاده بارگذاری می‌شود");
  } catch (e) { /* ignore */ }
}

async function poll() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("dQwen").className = "dot" + (h.qwen.ok ? " ok" : ""); $("dOcr").className = "dot" + (h.ocr.ok ? " ok" : "");
    $("res").textContent = `RAM ${h.resources.ram_used_gb}GB · CPU ${h.resources.cpu_percent}%`;
  } catch { $("dQwen").className = $("dOcr").className = "dot"; }
}
$("userName").value = userName();
$("userName").addEventListener("input", () => {
  try { localStorage.setItem("pm_user_name", $("userName").value.trim()); } catch (e) { /* storage disabled */ }
  if ($("log").querySelector(".empty")) showEmpty();
});
showEmpty(); syncAuto();
refreshModels(); setInterval(refreshModels, 3000);
paddleInfo(); poll(); setInterval(poll, 5000);
fetch("/api/version").then(r => r.json()).then(v => { $("ver").textContent = "v" + v.version + (v.commit ? " · " + v.commit : ""); }).catch(() => {});
</script>
